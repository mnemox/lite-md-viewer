<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lite MD Viewer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <link rel="stylesheet" href="/vendor/highlight-github.min.css" id="hljs-light" />
  <link rel="stylesheet" href="/vendor/highlight-github-dark.min.css" id="hljs-dark" />
  <link rel="stylesheet" href="/css/style.css" />

  <script>
    // Set theme early to avoid a flash of the wrong colors.
    (function () {
      try {
        var t = localStorage.getItem('mdm-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var l = document.getElementById('hljs-light'), d = document.getElementById('hljs-dark');
        if (l) l.disabled = (t === 'dark');
        if (d) d.disabled = (t !== 'dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="bar-left">
      <button id="menuBtn" class="icon-btn" aria-label="Toggle menu" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <span id="fileTitle" class="file-title" dir="auto"></span>
      <span id="fileStatus" class="badge"></span>
    </div>
    <div class="bar-center">
      <div class="search-scope" role="tablist" aria-label="Document mode">
        <button id="viewModeBtn" class="search-scope-pill active" type="button" role="tab" aria-selected="true">View</button>
        <button id="editModeBtn" class="search-scope-pill" type="button" role="tab" aria-selected="false">Edit</button>
      </div>
      <button id="detailsBtn" class="btn" title="File details">Details</button>
      <button id="relationsBtn" class="btn" title="Document relations">Relations</button>
      <button id="notesBtn" class="btn" title="Show document notes">Notes <span id="notesBtnCount" class="btn-badge hidden" aria-hidden="true">0</span></button>
      <button id="askBtn" class="btn" title="Ask a local model about this document">Ask</button>
    </div>
    <div class="bar-right">
      <div id="searchWrap" class="search-wrap">
        <!-- Scope switch: only meaningful, and only shown, while a document is open. -->
        <div id="searchScope" class="search-scope hidden" role="tablist" aria-label="Search scope">
          <button class="search-scope-pill" data-scope="doc" type="button" role="tab" aria-selected="false">Document</button>
          <button class="search-scope-pill" data-scope="all" type="button" role="tab" aria-selected="true">All</button>
        </div>
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
          <input id="searchInput" class="search-input" type="text" placeholder="Search documents…"
                 autocomplete="off" spellcheck="false" aria-label="Search documents"
                 role="combobox" aria-expanded="false" aria-controls="searchPanel" aria-autocomplete="list">
          <button id="searchClear" class="search-clear hidden" aria-label="Clear search" title="Clear">×</button>
        </div>
        <div id="searchPanel" class="search-panel hidden" role="listbox" aria-label="Search results"></div>
      </div>
      <button id="saveBtn" class="btn primary hidden">Save</button>
      <button id="themeBtn" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode">🌙</button>
    </div>
  </header>

  <!-- left-edge hover hot-zone that opens the drawer -->
  <div id="edgeZone" class="edge-zone" aria-hidden="true"></div>

  <aside id="drawer" class="drawer" aria-hidden="true" aria-label="Managed files">
    <!-- top part: dashboard navigation -->
    <div class="drawer-top">
      <button id="dashboardBtn" class="drawer-nav-item" title="Open notes">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span>Notes</span>
      </button>
      <button id="boardsBtn" class="drawer-nav-item" title="Open boards">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <span>Boards</span>
      </button>
    </div>
    <!-- bottom part: managed files -->
    <div class="drawer-head">
      <button id="newFileBtn" class="btn primary" title="Create a new Markdown file">+ New file</button>
      <div class="add-menu-wrap">
        <button id="addBtn" class="btn" title="Add existing files from disk" aria-haspopup="menu" aria-expanded="false">Add<svg class="chev" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
        <div id="addMenu" class="add-menu hidden" role="menu" aria-label="Add from disk">
          <button id="addFileOpt" class="add-menu-item" role="menuitem">
            <span class="ami-icon">📄</span>
            <span class="ami-text"><span class="ami-label">Add file</span><span class="ami-desc">Pick a single Markdown or XML file</span></span>
          </button>
          <button id="addFolderFilesOpt" class="add-menu-item" role="menuitem">
            <span class="ami-icon">📁</span>
            <span class="ami-text"><span class="ami-label">Add folder</span><span class="ami-desc">All Markdown &amp; XML files in a folder</span></span>
          </button>
        </div>
      </div>
      <button id="addFolderBtn" class="btn" title="New folder">New folder</button>
      <button id="drawerCloseBtn" class="icon-btn" title="Close menu" aria-label="Close menu">✕</button>
    </div>
    <nav id="tree" class="tree" aria-label="File tree"></nav>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <main class="main">
    <div class="content">
      <div id="loading" class="loading hidden" role="status" aria-label="Loading"><span class="spinner" aria-hidden="true"></span></div>

      <section id="welcome" class="welcome">
        <h1>Lite MD Viewer</h1>
        <p>View and edit Markdown and XML files (including Mermaid diagrams).</p>
        <button class="btn primary" id="welcomeAdd">+ Add a file</button>
      </section>

      <!-- dashboard: a board of free-positioned sticky notes (wheel-zoom + drag-pan) -->
      <section id="dashboard" class="dashboard hidden">
        <div id="dashboardViewport" class="dash-viewport">
          <div id="dashboardBoard" class="dash-board" aria-label="Notes board"></div>
        </div>
        <div class="dash-toolbar">
          <button type="button" class="icon-btn" data-act="out" title="Zoom out" aria-label="Zoom out">−</button>
          <button type="button" class="icon-btn" data-act="fit" title="Reset zoom" aria-label="Reset zoom">⤢</button>
          <button type="button" class="icon-btn" data-act="in"  title="Zoom in"  aria-label="Zoom in">+</button>
        </div>
        <div class="dash-fab-wrap">
          <div id="dashFabMenu" class="dash-fab-menu hidden" role="menu" aria-label="Add a note">
            <button id="addNoteOpt" class="dash-fab-item" role="menuitem">
              <span class="dfi-icon">📝</span>
              <span class="dfi-text"><span class="dfi-label">Add note</span><span class="dfi-desc">A markdown sticky note</span></span>
            </button>
            <button id="addFlipNoteOpt" class="dash-fab-item" role="menuitem">
              <span class="dfi-icon">🔁</span>
              <span class="dfi-text"><span class="dfi-label">Add flipping note</span><span class="dfi-desc">A two-sided card that flips</span></span>
            </button>
          </div>
          <button id="dashFab" class="dash-fab" title="Add a note" aria-haspopup="menu" aria-expanded="false" aria-label="Add a note">+</button>
        </div>
      </section>

      <!-- boards: free-positioned project boards (wheel-zoom + drag-pan) -->
      <section id="boards" class="dashboard hidden">
        <div id="boardsViewport" class="dash-viewport">
          <div id="boardsBoard" class="dash-board" aria-label="Boards screen"></div>
        </div>
        <div class="dash-toolbar" id="boardsToolbar">
          <button type="button" class="icon-btn" data-act="out" title="Zoom out" aria-label="Zoom out">−</button>
          <button type="button" class="icon-btn" data-act="fit" title="Reset zoom" aria-label="Reset zoom">⤢</button>
          <button type="button" class="icon-btn" data-act="in"  title="Zoom in"  aria-label="Zoom in">+</button>
        </div>
        <div class="dash-fab-wrap">
          <button id="boardsAddBtn" class="dash-fab" title="Add a board" aria-label="Add a board">+</button>
        </div>
      </section>

      <!-- board lists: one board opened as Trello-style columns of cards -->
      <section id="boardLists" class="board-lists-screen hidden">
        <header class="bl-header">
          <button id="blBack" class="btn bl-back" type="button" title="Back to boards">← Boards</button>
          <h2 id="blTitle" class="bl-title" dir="auto"></h2>
        </header>
        <div id="blCanvas" class="bl-canvas" aria-label="Lists"></div>
      </section>

      <div id="dbWarning" class="db-warning hidden" role="alert">
        <svg class="db-warning-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span class="db-warning-text">This file no longer exists on disk — showing the last saved copy from the database (read-only).</span>
        <button id="recreateBtn" class="btn">Recreate file</button>
      </div>

      <article id="viewer" class="viewer markdown-body hidden" dir="auto"></article>

      <div id="editor" class="editor hidden">
        <textarea id="editorText" class="editor-text" spellcheck="false" dir="auto"
                  aria-label="Document source"></textarea>
        <article id="editorPreview" class="viewer markdown-body editor-preview" dir="auto"></article>
      </div>
    </div>

    <!-- per-document notes panel (top-right, collapsible); only shown when a file is open -->
    <aside id="docNotesPanel" class="doc-notes-panel" aria-label="Document notes">
      <div id="docNotesResize" class="doc-notes-resize" title="Drag to resize" aria-hidden="true"></div>
      <div class="doc-notes-head">
        <button id="docNotesToggle" class="doc-notes-toggle" aria-expanded="true" title="Collapse notes">
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="doc-notes-title">Notes</span>
          <span id="docNotesCount" class="doc-notes-count">0</span>
        </button>
        <button id="docNotesAdd" class="icon-btn" title="Add note" aria-label="Add note">+</button>
      </div>
      <div id="docNotesList" class="doc-notes-list"></div>
    </aside>

    <!-- local analysis chat panel (left edge, full height); only shown when local analysis
         is enabled (see run.bat --setup-ai), a document is open, and the user presses Ask -->
    <aside id="aiPanel" class="ai-panel" aria-label="Ask about this document">
      <div id="aiPanelResize" class="doc-notes-resize" title="Drag to resize" aria-hidden="true"></div>
      <div class="doc-notes-head">
        <button id="aiPanelToggle" class="doc-notes-toggle" aria-expanded="true" title="Collapse chat">
          <svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          <span class="doc-notes-title">Ask</span>
        </button>
        <button id="aiPanelClear" class="icon-btn" title="Clear conversation" aria-label="Clear conversation">🗑</button>
        <button id="aiPanelClose" class="icon-btn" title="Close" aria-label="Close">✕</button>
      </div>
      <div id="aiPanelStatus" class="ai-panel-status hidden"></div>
      <div id="aiPanelMessages" class="ai-panel-messages"></div>
      <form id="aiPanelForm" class="ai-panel-composer">
        <textarea id="aiPanelInput" class="ai-panel-input" rows="2"
                  placeholder="Ask about this document…" aria-label="Question"></textarea>
        <button id="aiPanelSend" type="submit" class="btn primary" title="Send (Enter)">Send</button>
      </form>
    </aside>

    <!-- floating "+" action button (bottom-right); only shown when a file is open -->
    <div id="docFabWrap" class="doc-fab-wrap">
      <div id="docFabMenu" class="doc-fab-menu hidden" role="menu" aria-label="Add a note">
        <button id="addDocNoteOpt" class="doc-fab-item" role="menuitem">
          <span class="dfi-icon">📝</span>
          <span class="dfi-text"><span class="dfi-label">Add note</span><span class="dfi-desc">A markdown note for this document</span></span>
        </button>
      </div>
      <button id="docFab" class="doc-fab" title="Add a note" aria-haspopup="menu" aria-expanded="false" aria-label="Add a note">+</button>
    </div>
  </main>

  <!-- Note editor modal (add/edit) -->
  <div id="noteEditorModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Note editor">
    <div class="modal-card note-editor">
      <div class="modal-head">
        <strong id="noteEditorTitle">Add note</strong>
        <button class="icon-btn" id="noteEditorClose" aria-label="Close">✕</button>
      </div>
      <div class="note-editor-body">
        <textarea id="noteEditorText" class="note-editor-text" spellcheck="false" dir="auto" placeholder="Write markdown…" aria-label="Note text"></textarea>
        <article id="noteEditorPreview" class="note-editor-preview viewer markdown-body" dir="auto"></article>
      </div>
      <div class="modal-foot">
        <button class="btn" id="noteEditorCancel">Cancel</button>
        <button class="btn primary" id="noteEditorSave">Save</button>
      </div>
    </div>
  </div>

  <!-- Add-file browser modal -->
  <div id="browseModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Add a file">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="browseTitle">Add a file</strong>
        <button class="icon-btn" id="browseClose" aria-label="Close">✕</button>
      </div>
      <div class="browse-bar">
        <button class="btn" id="browseUp" title="Up one level">↑</button>
        <span id="browseCrumb" class="crumb" dir="auto"></span>
      </div>
      <input id="browseFilter" class="input" placeholder="Filter this folder…" />
      <ul id="browseList" class="browse-list"></ul>
      <div class="modal-foot">
        <input id="browsePath" class="input grow" placeholder="…or paste a full path to a .md, .markdown, or .xml file" dir="auto" />
        <button class="btn primary" id="browseAddPath">Add</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Vendored libraries (offline; no CDN at runtime) -->
  <script src="/vendor/markdown-it.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/mermaid.min.js"></script>
  <script src="/vendor/three.min.js"></script>
  <!-- aichat.js is imported by app.js as an ES module; no separate tag needed. -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
