[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-vector"
version = "0.2.0"
description = "A tiny local database with scalar indexes, full-text search and hnswlib vector search"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    # chroma-hnswlib is a maintained fork of hnswlib that ships prebuilt wheels
    # (including Windows/cp310) and imports as `hnswlib`, so no C++ compiler is
    # needed to install. The upstream `hnswlib` sdist has no wheels and fails to
    # build on machines without MSVC Build Tools.
    "chroma-hnswlib>=0.7.6",
]

[tool.setuptools]
py-modules = ["local_vector_db"]
